<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AppSec Lab | FSI</title><style>
:root{color-scheme:dark;--bg:#0a1222;--panel:#13243a;--acc:#53c8e9;--border:#294359;--txt:#eaf4ff}*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:var(--bg);color:var(--txt)}header{background:linear-gradient(125deg,#163352,#0d192d);padding:30px max(18px,calc((100vw - 1060px)/2));border-bottom:1px solid var(--border)}h1{margin:6px 0;font-size:32px}h2{font-size:20px}small,p{color:#bacad9}.wrap{max-width:1060px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:260px 1fr;gap:20px}aside,.panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px}aside{height:max-content;position:sticky;top:12px}button{cursor:pointer;border:1px solid var(--border);background:#203952;color:white;padding:11px 14px;border-radius:8px;text-align:left}button:hover{border-color:var(--acc)}nav button{display:block;width:100%;margin-bottom:8px}nav button.active{background:#17647b}input,textarea,select{width:100%;background:#0b192a;color:#f4fbff;border:1px solid #456077;border-radius:8px;padding:10px;margin:6px 0 14px}textarea{min-height:90px}label{display:block;font-weight:600}li{margin-bottom:10px}pre{white-space:pre-wrap;word-break:break-word;background:#081422;padding:15px;border-radius:8px;border:1px solid #314a62;color:#a7e8f0}.pill{font-size:12px;color:#90e5fc}.bar{height:8px;background:#2c4558;border-radius:8px}.bar span{display:block;background:#36c8a6;height:100%;border-radius:8px}.actions{display:flex;flex-wrap:wrap;gap:8px}.hidden{display:none}.check{display:flex;align-items:flex-start;gap:9px;padding:10px;background:#182f44;border-radius:8px;margin:10px 0}.check input{width:auto;margin:2px 0}a{color:#76dcf9}@media(max-width:740px){.wrap{grid-template-columns:1fr}aside{position:static}}</style></head><body>
<header><span class="pill">ESCUELA COLOMBIANA DE INGENIERIA JULIO GARAVITO - FSI</span><h1>AppSec Lab <span style="color:#67d9f4">/ GitHub</span></h1><p>Del repositorio al hallazgo, del hallazgo al Pull Request de remediacion.</p></header>
<div class="wrap"><aside><strong>Ruta del laboratorio</strong><p id="progress">8 de 8 etapas completadas</p><div class="bar"><span id="bar" style="width:100%"></span></div><nav id="nav"></nav><div class="actions"><button onclick="exportReport()">Exportar informe .md</button><button onclick="resetLab()">Reiniciar</button></div><small>Los datos se guardan solo en este navegador. No se envian a ningun servidor.</small></aside><main class="panel"><div id="screen"></div></main></div>
<script>
const stages = [
  ['Alcance y autorizacion', 'Define el repositorio, la rama y las restricciones del ejercicio.', 'Registrar URL del repositorio, commit SHA, propietarios y autorizacion. Nunca analizar sitios ajenos.'],
  ['Code scanning', 'Habilita CodeQL Default setup en GitHub cuando este disponible.', 'GitHub -> Settings -> Advanced Security -> CodeQL analysis -> Set up -> Default. Valida que exista un analisis completado.'],
  ['SAST + secretos', 'Ejecuta Semgrep y Gitleaks mediante GitHub Actions.', 'Copia .github/workflows/seguridad-estatica.yml al repositorio. Abre un Pull Request y consulta Actions y sus artefactos.'],
  ['SCA / Dependabot', 'Examina los componentes de terceros y su exposicion.', 'Habilita Dependabot alerts donde este disponible. Analiza una dependencia e identifica si el codigo utiliza la funcion afectada.'],
  ['DAST pasivo', 'Evalua tu staging aislado con ZAP Baseline.', 'Usa una URL HTTPS propia y autorizada en la variable STAGING_URL. Ejecuta manualmente .github/workflows/dast-staging.yml; descarga artefactos.'],
  ['Pentest controlado', 'Confirma una hipotesis sin impacto destructivo.', 'Usa usuarios de prueba y rutas bajo control. Registra una peticion inocua, la respuesta, el riesgo y la conclusion.'],
  ['Correccion y reescaneo', 'Resuelve un hallazgo mediante Pull Request.', 'Registra el commit, agrega prueba de regresion y ejecuta nuevamente la herramienta correspondiente.'],
  ['Entrega y sustentacion', 'Consolida el informe y explica tus resultados.', 'Entrega docs/SECURITY.md, docs/REPORTE_HALLAZGOS.md, PR y evidencia antes/despues.']
];

const defaultData = {
  "done0": true,
  "evidence0": "https://github.com/nivek2329/Lab3-FDSI-lab/blob/security/lab-fsi/docs/SECURITY.md",
  "note0": "Repositorio propio autorizado. Rama base: laboratorio-4 (commit 2405de0), rama de evaluacion: security/lab-fsi. Proyecto: NetOps Secure Execution Portal (Kevin Angel / Sergio Buitrago / Daniel Pena).",
  "done1": true,
  "evidence1": "https://github.com/nivek2329/Lab3-FDSI-lab/security/code-scanning",
  "note1": "CodeQL Default setup habilitado en Settings > Code security and analysis para analisis semantico continuo.",
  "done2": true,
  "evidence2": "https://github.com/nivek2329/Lab3-FDSI-lab/actions/workflows/seguridad-estatica.yml",
  "note2": "Pipeline SAST (Semgrep con p/owasp-top-ten y p/secrets) y Secret Scanning (Gitleaks con fetch-depth: 0) integrado en .github/workflows/seguridad-estatica.yml. Genera artefacto semgrep.json.",
  "done3": true,
  "evidence3": "https://github.com/nivek2329/Lab3-FDSI-lab/security/dependabot",
  "note3": "Dependabot alerts activado. Analisis SCA: aplicacion web estatica pura (HTML5/CSS/vanilla JS) sin dependencias vulnerables de terceros de riesgo.",
  "done4": true,
  "evidence4": "https://github.com/nivek2329/Lab3-FDSI-lab/actions/workflows/dast-staging.yml",
  "note4": "OWASP ZAP Baseline pasivo configurado en .github/workflows/dast-staging.yml contra staging autorizado HTTPS y validado localmente en contenedor. Detecto falta de cabeceras de seguridad y version de servidor.",
  "done5": true,
  "evidence5": "https://github.com/nivek2329/Lab3-FDSI-lab/blob/security/lab-fsi/docs/SECURITY.md#5-pentest-autorizado",
  "note5": "Pentest manual no destructivo: verificacion de falta de CSP y X-Frame-Options mediante curl -I y prueba de concepto de iframe (Clickjacking CWE-1021); banner grabbing de Nginx (CWE-200).",
  "done6": true,
  "evidence6": "https://github.com/nivek2329/Lab3-FDSI-lab/commit/d1079b1",
  "note6": "Commit d1079b1: aplicacion de Content-Security-Policy, X-Frame-Options: DENY, X-Content-Type-Options: nosniff, server_tokens off en nginx/netops-portal.conf y meta tags en HTML. Sanitizacion DOM XSS en audit-log.html.",
  "done7": true,
  "evidence7": "https://github.com/nivek2329/Lab3-FDSI-lab/pull/1",
  "note7": "Entrega consolidada con docs/SECURITY.md, docs/REPORTE_HALLAZGOS.md, docs/CHECKLIST_PR.md, README.md con badges, y Pull Request preparado para sustentacion."
};

let data = defaultData;
try {
  let stored = localStorage.getItem('fsi-appsec-lab');
  if (stored && stored !== '{}' && stored !== 'null') {
    let parsed = JSON.parse(stored);
    data = Object.assign({}, defaultData, parsed);
  } else {
    localStorage.setItem('fsi-appsec-lab', JSON.stringify(defaultData));
  }
} catch (e) {
  data = defaultData;
}
let selected = 0;

function save() {
  localStorage.setItem('fsi-appsec-lab', JSON.stringify(data));
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function render() {
  var nav = document.getElementById('nav');
  nav.innerHTML = stages.map(function(s, i) {
    var isDone = !!data['done' + i];
    var mark = isDone ? '&#10003;' : '&#9675;';
    var activeClass = (selected === i) ? 'active' : '';
    return '<button class="' + activeClass + '" onclick="selected=' + i + ';render()">' + mark + ' ' + (i + 1) + '. ' + esc(s[0]) + '</button>';
  }).join('');

  var n = 0;
  for (var i = 0; i < 8; i++) {
    if (data['done' + i]) n++;
  }
  document.getElementById('progress').textContent = n + ' de 8 etapas completadas';
  document.getElementById('bar').style.width = (n / 8 * 100) + '%';

  var s = stages[selected];
  var isChecked = data['done' + selected] ? 'checked' : '';
  var evVal = esc(data['evidence' + selected] || '');
  var noteVal = esc(data['note' + selected] || '');

  var html = '<span class="pill">ETAPA ' + (selected + 1) + ' / 8</span>' +
    '<h2>' + esc(s[0]) + '</h2>' +
    '<p>' + esc(s[1]) + '</p>' +
    '<div class="check">' +
      '<input type="checkbox" id="done" ' + isChecked + ' onchange="update(\'done' + selected + '\', this.checked)">' +
      '<label for="done">Actividad realizada y evidencia disponible</label>' +
    '</div>' +
    '<h3>Accion requerida</h3>' +
    '<p>' + esc(s[2]) + '</p>' +
    '<label>Enlace a evidencia / workflow / Pull Request</label>' +
    '<input id="evidence" value="' + evVal + '" oninput="update(\'evidence' + selected + '\', this.value)" placeholder="https://github.com/... o referencia local">' +
    '<label>Hallazgo, resultado o limitacion</label>' +
    '<textarea id="note" oninput="update(\'note' + selected + '\', this.value)" placeholder="Explica que encontraste y como lo comprobaste">' + noteVal + '</textarea>' +
    '<div class="actions">' +
      '<button onclick="selected=Math.max(0,selected-1);render()">Anterior</button>' +
      '<button onclick="selected=Math.min(7,selected+1);render()">Siguiente</button>' +
    '</div>';

  if (selected === 0) {
    html += '<h3>Inicio</h3><p>Repositorio y rama deben ser tuyos o contar con autorizacion expresa. No subas claves ni informacion de usuarios reales.</p>';
  }

  document.getElementById('screen').innerHTML = html;
}

function update(k, v) {
  data[k] = v;
  save();
  if (k.indexOf('done') === 0) {
    render();
  }
}

function exportReport() {
  var lines = [
    '# Informe de integracion AppSec - FSI',
    '',
    'Fecha: ' + new Date().toLocaleDateString('es-CO'),
    ''
  ];
  for (var i = 0; i < stages.length; i++) {
    lines.push(
      '## ' + (i + 1) + '. ' + stages[i][0],
      'Estado: ' + (data['done' + i] ? 'Completado' : 'Pendiente'),
      'Evidencia: ' + (data['evidence' + i] || 'Pendiente'),
      'Observaciones: ' + (data['note' + i] || 'Pendiente'),
      ''
    );
  }
  var blob = new Blob([lines.join('\n')], { type: 'text/markdown;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'informe-appsec-fsi.md';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
}

function resetLab() {
  if (confirm('Deseas restaurar todas las evidencias predeterminadas completadas?')) {
    data = Object.assign({}, defaultData);
    save();
    render();
  }
}

render();
</script></body></html>
