name: Seguridad estática - SAST y secretos
on:
  push:
    branches: [main, master, laboratorio-4, security/lab-fsi, correccion-errores-escaneo]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sast:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'
      - name: Instalar Semgrep
        run: python -m pip install --upgrade semgrep
      - name: Análisis con reglas comunitarias
        run: semgrep scan --config p/owasp-top-ten --config p/secrets --json --output semgrep.json || true
      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: resultado-semgrep
          path: semgrep.json
          if-no-files-found: warn
  secretos:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Detección de secretos
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # En repositorios de organizaciones puede requerirse GITLEAKS_LICENSE.
