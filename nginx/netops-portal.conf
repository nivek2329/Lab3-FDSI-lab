# Configuración Nginx HARDENED — Remediación Laboratorio 05 AppSec
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/netops-portal;
    index index.html;
    server_name _;
    
    # === REMEDIACIÓN F-02: Supresión de versión del servidor ===
    server_tokens off;

    # === REMEDIACIÓN F-01: Cabeceras de seguridad HTTP (CWE-693 / CWE-1021) ===
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # === PROTECCIÓN: Bloqueo de acceso a archivos y directorios ocultos (.git, .env) ===
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
