# ===============================================================
# Configuración Nginx HARDENED (Fase E - Post-Hardening)
# NetOps Secure Execution Portal — Laboratorio 3 FDSI
# Grupo G06: Daniel Peña · Kevin Ángel · Sergio Buitrago
# ===============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/netops-portal;
    index index.html;
    server_name _;

    # ── Hardening Inicial (Blue Team - Paso 15) ─────────────────
    # 1. Ocultar versión y banner de Nginx (Mitiga R02 e Information Disclosure)
    server_tokens off;

    # 2. Cabeceras de seguridad HTTP obligatorias
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 3. Deshabilitar listado de directorios
    autoindex off;

    # ── Rutas de la Aplicación ─────────────────────────────────
    location / {
        try_files $uri $uri/ =404;
    }

    # ── Bloqueo de Archivos Ocultos y Sensibles (.git, .env, etc.) (R08)
    location ~ /\. {
        deny all;
        return 403;
    }

    # ── Telemetría y Registro de Eventos (Blue Team) ───────────
    access_log /var/log/nginx/netops-access.log;
    error_log  /var/log/nginx/netops-error.log;
}
